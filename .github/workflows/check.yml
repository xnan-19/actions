name: Sagano Ticket Watcher

on:
  schedule:
    # 严格每 30 分钟定时触发一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sagano-ticket-watcher
  cancel-in-progress: true

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run ticket monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python .github/workflows/monitor.py
