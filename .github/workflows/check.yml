name: Sagano Ticket Watcher

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟尝试启动一次容器
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run ticket monitor (Loop for 25 mins)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          # 每次运行持续 25 分钟，每 45 秒检测一次，彻底规避 GitHub 丢任务
          python -c "
          import time
          from monitor import run
          end_time = time.time() + 25 * 60
          while time.time() < end_time:
              run()
              time.sleep(45)
          "
