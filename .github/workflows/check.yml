name: 岚山小火车纯接口抢票与直达Visa支付机器人

on:
  schedule:
    # 严格每 15 分钟全自动轮询一次
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_bark:
        description: '是否立即发送 Bark 测试推送 (true/false)'
        required: false
        default: 'false'
      target_dates:
        description: '监控目标日期 (多日期用逗号分隔，如 2026-10-31,2026-11-01)'
        required: true
        default: '2026-10-31'
      tickets_count:
        description: '购票张数'
        required: true
        default: '2'

concurrency:
  group: sagano-ticket-watcher
  cancel-in-progress: true

jobs:
  check-and-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run ticket monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_BARK: ${{ github.event.inputs.test_bark || 'false' }}
          TARGET_DATES: ${{ github.event.inputs.target_dates || '2026-10-31' }}
          TICKETS_COUNT: ${{ github.event.inputs.tickets_count || '2' }}
        run: python .github/workflows/monitor.py
