name: Sagano Ticket Watcher

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟触发一次
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run ticket monitor (Loop for 25 mins)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          end_time=$((SECONDS + 25 * 60))
          while [ $SECONDS -lt $end_time ]; do
            python .github/workflows/monitor.py
            sleep 45
          done
