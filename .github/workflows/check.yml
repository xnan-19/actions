name: Sagano Ticket Watcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sagano-ticket-watcher
  cancel-in-progress: true

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run ticket monitor (Loop 25 mins with auto-heal)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          end_time=$((SECONDS + 25 * 60))
          while [ $SECONDS -lt $end_time ]; do
            # 增加 || true 容灾保护，即便单次脚本偶发异常退出，容器绝不中断，60秒后自动重新拉起
            python .github/workflows/monitor.py || echo "⚠️ 单次巡查遇到偶发网络故障，已触发自愈，将在下轮自动重试..."
            sleep 60
          done
